name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

# One production deploy at a time; never cancel a release mid-flight.
concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    uses: damian1000/.github/.github/workflows/deploy.yml@main
    with:
      app: trading-desk
      url: https://desk.damianhoward.com
      health-port: "8084"
      # Longer than the shared default: this service's /readyz reports its upstreams, and the
      # first probe after a restart has twice reported them unhealthy before settling.
      hold-seconds: 20
    secrets: inherit
